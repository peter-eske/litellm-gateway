# /www/wwwroot/gateway.ftbot.de/docker-compose.yml

services:
  litellm-gateway:
    image: litellm/litellm:main-stable
    container_name: litellm-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - UI_USERNAME=${UI_USERNAME}
      - UI_PASSWORD=${UI_PASSWORD}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
    command: ["--port", "4000", "--config", "/app/config.yaml"]
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os,urllib.request as u; req=u.Request('http://localhost:4000/health'); req.add_header('Authorization','Bearer '+os.environ['LITELLM_MASTER_KEY']); exit(0 if u.urlopen(req).getcode() in (200,301,302) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 512M   # LiteLLM braucht realistisch ~300-400MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
# /www/wwwroot/gateway.ftbot.de/docker-compose.yml

services:
  litellm-gateway:
    image: ghcr.io/peter-eske/litellm-gateway:latest
    container_name: litellm-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - UI_USERNAME=${UI_USERNAME}
      - UI_PASSWORD=${UI_PASSWORD}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').getcode() in (200, 301, 302) else 1)"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 15s
    # deploy-Limits entfernt: 512M + healthcheck-Fails verursachten OOM (exit 137).
    # Steuerung erfolgt über host-level cgroups/Traefik-Rate-Limits.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
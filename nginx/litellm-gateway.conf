# /www/wwwroot/gateway.ftbot.de/nginx/litellm-gateway.conf

limit_req_zone $binary_remote_addr zone=llm_global:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=llm_api:10m    rate=10r/s;
limit_conn_zone $binary_remote_addr zone=llm_conn:10m;

upstream litellm {
    server 127.0.0.1:4000;
    keepalive 4;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gateway.ftbot.de;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.ftbot.de;

    ssl_certificate     /etc/letsencrypt/live/gateway.ftbot.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.ftbot.de/privkey.pem;
    ssl_protocols       TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;

    # Limits
    client_max_body_size  2m;
    client_body_timeout   30s;
    client_header_timeout 10s;
    limit_conn llm_conn   10;

    # Logs
    access_log /var/log/nginx/litellm-gateway.access.log;
    error_log  /var/log/nginx/litellm-gateway.error.log warn;

    # ── Health (kein Rate Limit) ──
    location = /health {
        proxy_pass         http://litellm;
        proxy_set_header   Host $host;
        proxy_read_timeout 10s;
    }

    # ── LiteLLM UI (nur von definierten IPs) ──
    location /ui {
        # UI nur lokal oder mit IP-Schutz
        allow 127.0.0.1;
        deny all;
        proxy_pass http://litellm;
        proxy_set_header Host $host;
    }

    # ── API Endpunkte ──
    location / {
        limit_req zone=llm_global burst=15 nodelay;
        limit_req zone=llm_api   burst=5  nodelay;

        proxy_pass         http://litellm;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Connection        "";

        # Streaming
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        chunked_transfer_encoding on;
    }
}
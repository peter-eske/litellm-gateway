# /www/wwwroot/gateway.ftbot.de/litellm-config.yaml

model_list:
  # ── Legacy-Kompatibilität (Chat/General) ────────────────────────────────
  # Rang 3 insgesamt, bewährt: swe_ver=72.0, mmlu=89.2, he=88.4, Verified=40.6
  - model_name: nim-llama
    litellm_params:
      model: openai/meta/llama-3.3-70b-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      max_tokens: 4096
      temperature: 0.2
      top_p: 0.7
      stream: true
      num_retries: 0
      request_timeout: 180

  # ── Allrounder (Default) ───────────────────────────────────────────────
  # Bester Allrounder mit Tool-Support: swe_ver=79%, lcb=91.6%, TTFT=0.96s
  - model_name: default
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4-flash
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      max_tokens: 8192
      temperature: 0.2
      num_retries: 0
      request_timeout: 300

  # ── Low-Latency (14B, 0.25s, stream+tools) ──────────────────────────
  - model_name: fast
    litellm_params:
      model: openai/mistralai/ministral-14b-instruct-2512
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      max_tokens: 4096
      temperature: 0.5
      stream: true
      num_retries: 0
      request_timeout: 60

  # ── Maximale Qualität (675B, 0.37s, stream+tools) ──────────────────
  - model_name: power
    litellm_params:
      model: openai/mistralai/mistral-large-3-675b-instruct-2512
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      max_tokens: 8192
      temperature: 0.2
      num_retries: 0
      request_timeout: 300

  # ── Code-Spezialist (Fortress 8.24, SWE-bench 26.0%, stream+tools) ──
  - model_name: coding
    litellm_params:
      model: openai/openai/gpt-oss-120b
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      max_tokens: 8192
      temperature: 0.1
      num_retries: 0
      request_timeout: 180

  # ── Deep Reasoning (v4-pro, 1.61s, stream, keine Tools) ─────────────
  - model_name: reasoning
    litellm_params:
      model: openai/deepseek-ai/deepseek-v4-pro
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      max_tokens: 8192
      temperature: 0.2
      stream: true
      num_retries: 0
      request_timeout: 300

  # ── Vision (90B, 4.11s, stream+tools, Bildverstehen) ────────────────
  - model_name: vision
    litellm_params:
      model: openai/meta/llama-3.2-90b-vision-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      max_tokens: 4096
      temperature: 0.2
      stream: true
      num_retries: 0
      request_timeout: 180

  # ── Content Safety Guard (8B, 0.36s, kein Stream) ───────────────────
  - model_name: safety
    litellm_params:
      model: openai/nvidia/llama-3.1-nemoguard-8b-content-safety
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      max_tokens: 512
      temperature: 0.1
      num_retries: 0
      request_timeout: 30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  public_endpoints: ["/health", "/health/liveliness"]
  drop_params: true
  add_function_to_prompt: false
  set_verbose: false
  ui_access_mode: "admin_only"

router_settings:
  enable_queue: true
  queue_type: "local"
  queue_timeout: 60
  num_retries: 0
  retry_after: 0
  routing_strategy: "simple-shuffle"

litellm_settings:
  success_callback: []
  failure_callback: []
  telemetry: false

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auf VPS deployen
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            if [ ! -d /www/wwwroot/gateway.ftbot.de/.git ]; then
              git clone https://github.com/peter-eske/litellm-gateway.git /www/wwwroot/gateway.ftbot.de
            else
              cd /www/wwwroot/gateway.ftbot.de && git pull
            fi
            chmod +x /www/wwwroot/gateway.ftbot.de/update.sh
            /www/wwwroot/gateway.ftbot.de/update.sh

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Auf VPS deployen
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            if [ ! -d /www/wwwroot/gateway.ftbot.de/.git ]; then
              echo ">>> Erstmalig: Repo klonen"
              git clone https://github.com/peter-eske/litellm-gateway.git /tmp/litellm-gateway
              cp -rT /tmp/litellm-gateway /www/wwwroot/gateway.ftbot.de/
              rm -rf /tmp/litellm-gateway
            else
              echo ">>> Git Reset + Pull (lokale Änderungen verwerfen)"
              cd /www/wwwroot/gateway.ftbot.de && git fetch origin && git reset --hard origin/main
            fi

            # POSTGRES_PASSWORD in .env ergänzen falls fehlend
            if ! grep -q POSTGRES_PASSWORD /www/wwwroot/gateway.ftbot.de/.env 2>/dev/null; then
              echo "POSTGRES_PASSWORD=$(tr -dc A-Za-z0-9 < /dev/urandom | head -c 24)" >> /www/wwwroot/gateway.ftbot.de/.env
              echo ">>> POSTGRES_PASSWORD zu .env hinzugefügt"
            fi

            # aaPanel NGINX-Config reparieren: https→http, Host→$host, streaming
            AA_CONF="/www/server/panel/vhost/nginx/gateway.ftbot.de.conf"
            if [ -f "$AA_CONF" ]; then
              echo ">>> aaPanel Config patchen"
              sed -i 's|proxy_pass https://localhost:4000|proxy_pass http://127.0.0.1:4000|' "$AA_CONF"
              sed -i 's|proxy_set_header Host localhost|proxy_set_header Host $host|' "$AA_CONF"
              if ! grep -q "proxy_buffering off" "$AA_CONF" 2>/dev/null; then
                sed -i '/proxy_set_header Connection "upgrade";/a\      proxy_buffering off;\n      proxy_cache off;' "$AA_CONF"
              fi
              nginx -t && systemctl reload nginx && echo ">>> NGINX neu geladen"
            fi

            chmod +x /www/wwwroot/gateway.ftbot.de/update.sh
            /www/wwwroot/gateway.ftbot.de/update.sh

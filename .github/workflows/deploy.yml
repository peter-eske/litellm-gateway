name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Auf VPS deployen
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            PROJECT_DIR="/www/wwwroot/gateway.ftbot.de"

            echo "════════════════════════════════════════"
            echo "  LiteLLM-Gateway Deploy"
            echo "════════════════════════════════════════"

            # ── Repo updaten ──
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo ">>> Erstmalig: Repo klonen"
              git clone https://github.com/peter-eske/litellm-gateway.git /tmp/litellm-gateway
              cp -rT /tmp/litellm-gateway "$PROJECT_DIR"
              rm -rf /tmp/litellm-gateway
            else
              echo ">>> Git Reset + Pull"
              cd "$PROJECT_DIR" && git fetch origin && git reset --hard origin/main
            fi

            # ── .env laden ──
            if [ ! -f "$PROJECT_DIR/.env" ]; then
              echo "[FEHLER] .env fehlt"
              exit 1
            fi
            source "$PROJECT_DIR/.env"

            # POSTGRES_PASSWORD in .env ergänzen falls fehlend
            if ! grep -q POSTGRES_PASSWORD "$PROJECT_DIR/.env" 2>/dev/null; then
              echo "POSTGRES_PASSWORD=$(tr -dc A-Za-z0-9 < /dev/urandom | head -c 24)" >> "$PROJECT_DIR/.env"
              echo ">>> POSTGRES_PASSWORD zu .env hinzugefügt"
            fi

            # ── aaPanel NGINX-Config patchen ──
            AA_CONF="/www/server/panel/vhost/nginx/gateway.ftbot.de.conf"
            if [ -f "$AA_CONF" ]; then
              echo ">>> aaPanel Config patchen"
              sed -i 's|proxy_pass https://localhost:4000|proxy_pass http://127.0.0.1:4000|' "$AA_CONF"
              sed -i 's|proxy_set_header Host localhost|proxy_set_header Host $host|' "$AA_CONF"
              if ! grep -q "proxy_buffering off" "$AA_CONF" 2>/dev/null; then
                sed -i '/proxy_set_header Connection "upgrade";/a\      proxy_buffering off;\n      proxy_cache off;' "$AA_CONF"
              fi
              if ! grep -q "proxy_read_timeout" "$AA_CONF" 2>/dev/null; then
                sed -i 's|proxy_pass http://127.0.0.1:4000;|proxy_pass http://127.0.0.1:4000;\n      proxy_read_timeout 300s;\n      proxy_send_timeout 300s;|' "$AA_CONF"
              fi

              # ── /debate/ Location für Debate-Server ──
              if ! grep -q "location /debate/" "$AA_CONF" 2>/dev/null; then
                sed -i '/^server {/a\  location /debate/ {\n    proxy_pass http://127.0.0.1:8000/;\n    proxy_http_version 1.1;\n    proxy_set_header Upgrade $http_upgrade;\n    proxy_set_header Connection "upgrade";\n    proxy_set_header Host $host;\n    proxy_buffering off;\n    proxy_cache off;\n    proxy_read_timeout 300s;\n  }' "$AA_CONF"
                echo ">>> /debate/ Location hinzugefügt"
              fi
              nginx -t && systemctl reload nginx && echo ">>> NGINX neu geladen"
            fi

              # ── Docker Container ──
            echo ""
            echo ">>> Container neustarten"
            cd "$PROJECT_DIR"
            docker rm -f litellm-gateway 2>/dev/null || true
            docker compose pull litellm-gateway postgres
            docker compose build debate-server
            docker compose up -d

            echo -n "Warte auf LiteLLM"
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:4000/health/liveliness >/dev/null 2>&1; then
                echo " bereit"
                break
              fi
              echo -n "."
              sleep 2
            done

            # ── Virtual Key (immer neu erstellen, alten verwerfen) ──
            echo ""
            echo ">>> Virtual Key für OpenCode"
            for kvid in $(curl -sf http://127.0.0.1:4000/key/list \
              -H "Authorization: Bearer $LITELLM_MASTER_KEY" 2>/dev/null \
              | python3 -c "import sys,json; [print(k['key_id']) for k in json.load(sys.stdin).get('keys',[]) if k.get('key','').startswith('sk-opencode-')]" 2>/dev/null); do
              echo "  Alten Key löschen: $kvid"
              curl -sf -X DELETE "http://127.0.0.1:4000/key/delete" \
                -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"key_ids\":[\"$kvid\"]}" >/dev/null 2>&1 || true
            done
            curl -sf -X POST http://127.0.0.1:4000/key/generate \
              -H "Authorization: Bearer $LITELLM_MASTER_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"key\": \"$OPENCODE_API_KEY\",
                \"models\": [\"nim-llama\", \"default\", \"fast\", \"power\", \"coding\", \"reasoning\", \"vision\", \"safety\"],
                \"rpm_limit\": 40,
                \"tpm_limit\": 1000000,
                \"max_parallel_requests\": 1,
                \"metadata\": {
                  \"description\": \"OpenCode Gateway Key\",
                  \"min_delay_ms\": 2100
                }
              }" >/dev/null 2>&1 && echo "Key erstellt (8 Modelle, 40 RPM)" || echo "Key-Erstellung fehlgeschlagen"

            # ── Verifikation ──
            echo ""
            echo ">>> Verifikation"
            echo -n "Health Liveliness: "
            curl -sf http://127.0.0.1:4000/health/liveliness >/dev/null 2>&1 && echo "OK" || echo "FEHLER"

            echo -n "Debate-Server SSE: "
            curl -sfN -o /dev/null -w "HTTP %{http_code}" http://127.0.0.1:8000/sse 2>/dev/null || echo "nicht bereit (normal bei erster Anfrage)"
            echo ""
            echo -n "Debate-Server via NGINX: "
            curl -sfN -o /dev/null -w "HTTP %{http_code}" https://gateway.ftbot.de/debate/sse --max-time 3 2>/dev/null || echo "prüfe später (erster Start)"

            echo ""
            echo "════════════════════════════════════════"
            echo "  DEPLOY FERTIG"
            echo "════════════════════════════════════════"
